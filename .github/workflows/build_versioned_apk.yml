name: Build & Publish Versioned Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile_client/**'
      - '.github/workflows/build_versioned_apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_android_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Compute versioned APK name
        id: version
        shell: bash
        run: |
          PUB_VER=$(grep '^version:' mobile_client/pubspec.yaml | awk '{print $2}' | tr -d '\r')
          BASE_VER="${PUB_VER%%+*}"
          BUILD_NUM="${{ github.run_number }}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG_NAME="v${BASE_VER}-b${BUILD_NUM}-${SHORT_SHA}"
          APK_NAME="PasadaNorte-v${BASE_VER}+b${BUILD_NUM}-${SHORT_SHA}.apk"
          echo "base_ver=${BASE_VER}" >> "$GITHUB_OUTPUT"
          echo "build_num=${BUILD_NUM}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies & build release APK
        working-directory: mobile_client
        run: |
          flutter pub get
          flutter build apk --release --android-skip-build-dependency-validation --build-name="${{ steps.version.outputs.base_ver }}" --build-number="${{ steps.version.outputs.build_num }}"

      - name: Rename APK with version
        run: |
          mkdir -p dist
          cp mobile_client/build/app/outputs/flutter-apk/app-release.apk "dist/${{ steps.version.outputs.apk_name }}"
          ls -lh "dist/${{ steps.version.outputs.apk_name }}"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.apk_name }}
          path: dist/${{ steps.version.outputs.apk_name }}

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: "PasadaNorte Android APK v${{ steps.version.outputs.base_ver }} (Build #${{ steps.version.outputs.build_num }})"
          body: |
            Automated release APK built from commit `${{ steps.version.outputs.short_sha }}`.
            **APK Filename:** `${{ steps.version.outputs.apk_name }}`
          files: dist/${{ steps.version.outputs.apk_name }}
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
