name: mobile_client
description: "Mobile client for PasadaNorte."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  http: ^1.2.0
  geolocator: ^11.0.0
  image_picker: ^1.0.7
  shared_preferences: ^2.2.2
  supabase_flutter: ^2.5.0
  url_launcher: ^6.3.0
  audioplayers: ^6.8.1
  flutter_local_notifications: ^23.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/screens/

